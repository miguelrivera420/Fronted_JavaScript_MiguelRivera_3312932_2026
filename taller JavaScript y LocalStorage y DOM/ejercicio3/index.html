<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de animales</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Catálogo de animales</h1>
    <p>Guarda animales en tu navegador usando <code>localStorage</code></p>
  </header>

  <main class="container">

    <section class="form-card">
      <h2>Agregar animal</h2>

      <form id="form-animal">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej: Luna" required>
        </div>

        <div class="form-group">
          <label for="especie">Especie</label>
          <input type="text" id="especie" placeholder="Ej: Perro" required>
        </div>

        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" id="edad" placeholder="Ej: 3" min="0" required>
        </div>

        <div class="form-group">
          <label for="habitat">Hábitat</label>
          <input type="text" id="habitat" placeholder="Ej: Doméstico" required>
        </div>

        <div class="form-group">
          <label for="imagen">URL de imagen</label>
          <input type="url" id="imagen" placeholder="https://..." required>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-agregar">Agregar animal</button>
          <button type="button" id="btn-mostrar">Mostrar animales</button>
        </div>
      </form>

      <p id="mensaje"></p>
    </section>

    <section id="lista-animales" class="lista-animales"></section>

  </main>

  <script src="index.js"></script>
</body>
</html>
